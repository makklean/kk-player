name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'icon-192.png'
      - 'icon-512.png'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'scripts/**'
      - 'assets/logo.svg'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Prepare local web assets
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Lock Android app to portrait orientation
        run: node scripts/lock-portrait.js

      - name: Set Android app version to 1.0
        run: node scripts/set-android-release-version.js

      - name: Prepare exact KK Player logo for Android assets
        run: |
          node -e "const sharp=require('sharp'); Promise.all([sharp('assets/logo.svg').resize(1024,1024).png().toFile('assets/icon-only.png'), sharp('assets/logo.svg').resize(1024,1024).png().toFile('assets/splash.png')]).catch(e=>{console.error(e);process.exit(1)})"

      - name: Generate Android app icon and splash screen
        run: npx capacitor-assets generate --android --pwa --iconBackgroundColor "#080b12" --iconBackgroundColorDark "#080b12" --splashBackgroundColor "#080b12" --splashBackgroundColorDark "#080b12"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK for sharing
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/KK-Player-1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KK-Player-1.0
          path: android/app/build/outputs/apk/debug/KK-Player-1.0.apk
          if-no-files-found: error
          retention-days: 14
